name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: first-large
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      # The axiom audit (SteppedFlapjack.Test.Axioms) runs as part of the build
      # above: it fails the SteppedFlapjackTests library if any declaration uses
      # an axiom beyond propext, Classical.choice and Quot.sound (sorry included).
      - name: Check non-test modules are warning-free
        run: ./scripts/check-warnings.sh

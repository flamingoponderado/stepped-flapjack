name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64, stepped-flapjack-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Clean the workspace except .lake
        run: git clean -ffdx -e .lake

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true

      # The axiom audit also runs inside the build above, but CI restores
      # build artifacts from earlier commits, and Lake does not see a newly added unimported
      # source file as a reason to rebuild it. Elaborate it afresh here.
      - name: Audit axioms of every SteppedFlapjack declaration
        run: lake lean SteppedFlapjack/Test/Axioms.lean

      - name: Check non-test modules are warning-free
        run: ./scripts/check-warnings.sh
